<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Watch Together • XemoTube</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="/socket.io/socket.io.js"></script>
<script src="/components/navbar.js" defer></script>

<style>
body {
  margin:0;
  font-family: Inter, sans-serif;
  background: radial-gradient(circle at top, #15182b, #0b0d16);
  color: #e4e6eb;
  overflow-x:hidden;
}

/* Navbar */
#online {
  position: fixed;
  left: 10px;
  top: 70px;
  background: rgba(26,29,46,0.9);
  padding: 0.5rem 1rem;
  border-radius: 8px;
  font-weight: 600;
  z-index: 1000;
}

/* Container */
#container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  padding: 1rem;
  gap: 1rem;
  margin-top: 64px;
}

/* Shared video */
#shared-video {
  flex: 1 1 700px;
  max-width: 1000px;
  border-radius: 16px;
  background: #000;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7);
}

/* Peer videos */
#peers {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.peer-video {
  width: 120px;
  height: 90px;
  border-radius: 12px;
  background: #000;
  box-shadow: 0 5px 20px rgba(0,0,0,0.4);
  cursor: grab;
  position: relative;
}

/* Draggable style */
.peer-video.dragging {
  opacity: 0.8;
  transform: scale(1.05);
}

/* Controls */
#controls {
  position: fixed;
  bottom: 10px;
  left:50%;
  transform: translateX(-50%);
  display:flex;
  gap:0.7rem;
  z-index: 1000;
}
#controls button {
  padding:.5rem 1rem;
  border:none;
  border-radius:999px;
  background: #5865f2;
  color:white;
  font-weight:600;
  cursor:pointer;
  transition: transform 0.2s, background 0.2s;
}
#controls button:hover {
  transform: scale(1.05);
  background: #7289da;
}

/* Chat */
#chat {
  position: fixed;
  right:0;
  top:64px;
  width:300px;
  height:calc(100% - 64px);
  background: rgba(15,15,30,0.95);
  display:flex;
  flex-direction:column;
  border-left: 1px solid rgba(176,110,255,0.2);
  z-index: 900;
}
#chat-header {
  padding: 0.5rem 1rem;
  font-weight: 600;
  border-bottom: 1px solid rgba(176,110,255,0.2);
  cursor: pointer;
}
#chat-messages {
  flex:1;
  overflow-y:auto;
  padding:0.5rem;
}
#chat input {
  padding:.5rem;
  border-radius:8px;
  border:none;
  margin:.5rem;
  background: #10121c;
  color: #e4e6eb;
}

/* Message style */
#chat-messages div {
  margin-bottom: 0.3rem;
}
#chat-messages b {
  color: #7289da;
}

/* Responsive */
@media(max-width:900px){
  #chat {
    width: 100%;
    height: 250px;
    bottom:0;
    top:auto;
  }
  #container {
    flex-direction: column;
    align-items: center;
  }
}
</style>
</head>

<body>
<custom-navbar></custom-navbar>
<div id="online">Online: 0</div>

<div id="container">
  <video id="shared-video" controls></video>
  <div id="peers"></div>
</div>

<!-- Controls -->
<div id="controls">
  <button id="mute">Mute</button>
  <button id="cam">Camera</button>
  <button id="play">Play</button>
</div>

<!-- Chat -->
<div id="chat">
  <div id="chat-header">💬 Chat (Click to toggle)</div>
  <div id="chat-messages"></div>
  <input id="chat-input" placeholder="Message...">
</div>

<script>
const socket = io();
const username = localStorage.getItem("xemo_username") || prompt("Enter your username") || "Guest";
localStorage.setItem("xemo_username", username);

let localStream = null;
const peers = {};
const peersContainer = document.getElementById("peers");
const sharedVideo = document.getElementById("shared-video");
const chatMessages = document.getElementById("chat-messages");
const chatInput = document.getElementById("chat-input");
const onlineEl = document.getElementById("online");

// Request camera/mic but don't show yet
navigator.mediaDevices.getUserMedia({ video:true, audio:true })
.then(stream => { localStream = stream; })
.catch(err => console.log("Camera/mic denied", err));

// Join room
socket.emit("join-room",{roomId:"global-call", username});

// Online users
socket.on("online-users", users => onlineEl.textContent = "Online: " + users.length);

// Chat
chatInput.addEventListener("keydown", e => {
  if(e.key==='Enter' && chatInput.value.trim()){
    socket.emit("chat-message",{username,text:chatInput.value});
    chatInput.value='';
  }
});
socket.on("chat-message", msg => {
  const div = document.createElement("div");
  div.innerHTML = `<b>@${msg.username}</b>: ${msg.text}`;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
});

// Video sync
socket.on("video-sync", data => {
  sharedVideo.currentTime = data.time;
  data.action==='play' ? sharedVideo.play() : sharedVideo.pause();
});

// Peer connection
socket.on("user-joined", ({id}) => createPeer(id,true));
socket.on("user-left", id => {
  if(peers[id]) { peers[id].video.remove(); peers[id].pc.close(); delete peers[id]; }
});
socket.on("signal", async ({from, signal})=>{
  if(!peers[from]) createPeer(from,false);
  if(signal.type==='offer'){
    await peers[from].pc.setRemoteDescription(new RTCSessionDescription(signal));
    const answer = await peers[from].pc.createAnswer();
    await peers[from].pc.setLocalDescription(answer);
    socket.emit("signal",{target:from, signal:peers[from].pc.localDescription});
  } else if(signal.type==='answer'){
    await peers[from].pc.setRemoteDescription(new RTCSessionDescription(signal));
  } else if(signal.candidate){
    await peers[from].pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
  }
});

// Controls
document.getElementById("mute").onclick = ()=>{
  if(!localStream) return;
  const track = localStream.getAudioTracks()[0];
  track.enabled = !track.enabled;
  document.getElementById("mute").textContent = track.enabled?"Mute":"Unmute";
};
document.getElementById("cam").onclick = ()=>{
  if(!localStream) return;
  const track = localStream.getVideoTracks()[0];
  track.enabled = !track.enabled;
  document.getElementById("cam").textContent = track.enabled?"Camera":"Show Cam";
};
document.getElementById("play").onclick = ()=>{
  if(sharedVideo.paused){
    sharedVideo.play();
    socket.emit("video-sync",{roomId:"global-call",action:"play",time:sharedVideo.currentTime});
  } else {
    sharedVideo.pause();
    socket.emit("video-sync",{roomId:"global-call",action:"pause",time:sharedVideo.currentTime});
  }
};

// Peer creation
function createPeer(id,initiator){
  const pc = new RTCPeerConnection();
  if(localStream) localStream.getTracks().forEach(track=>pc.addTrack(track,localStream));

  const video = document.createElement("video");
  video.autoplay = true;
  video.playsInline = true;
  video.classList.add("peer-video");
  peersContainer.appendChild(video);

  pc.ontrack = e=>video.srcObject = e.streams[0];
  pc.onicecandidate = e=>{ if(e.candidate) socket.emit("signal",{target:id, signal:{candidate:e.candidate}}); }

  // Make draggable
  makeDraggable(video);

  peers[id]={pc,video};

  if(initiator){
    pc.createOffer().then(offer=>{
      pc.setLocalDescription(offer);
      socket.emit("signal",{target:id, signal:offer});
    });
  }
}

// Draggable peer videos
function makeDraggable(el){
  let offsetX, offsetY, dragging=false;
  el.onmousedown = e=>{
    dragging=true;
    offsetX=e.offsetX;
    offsetY=e.offsetY;
    el.classList.add("dragging");
  }
  document.onmouseup=()=>{ dragging=false; el.classList.remove("dragging"); }
  document.onmousemove=e=>{
    if(!dragging) return;
    el.style.position="absolute";
    el.style.left=(e.clientX-offsetX)+"px";
    el.style.top=(e.clientY-offsetY)+"px";
  }
}

// Toggle chat
document.getElementById("chat-header").onclick=()=>{
  const chat=document.getElementById("chat");
  chat.style.display = chat.style.display==="none"?"flex":"flex";
};
</script>
</body>
</html>
