<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Watch Together • XemoTube</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Navbar & Socket.IO -->
<script src="/socket.io/socket.io.js"></script>
<script src="/components/navbar.js" defer></script>

<style>
/* ===== BODY ===== */
body {
  margin:0;
  font-family: Inter,sans-serif;
  background: radial-gradient(circle at top, #15182b, #0b0d16);
  color: #e4e6eb;
  overflow-x: hidden;
}

/* ===== ONLINE USERS ===== */
#online {
  position: fixed;
  left: 10px;
  top: 70px;
  background: rgba(26,29,46,0.9);
  padding: 0.5rem 1rem;
  border-radius: 8px;
  font-weight: 600;
  z-index: 1000;
}

/* ===== CONTAINER ===== */
#container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  padding: 1rem;
  gap: 1rem;
}

/* ===== SHARED VIDEO ===== */
#shared-video {
  flex: 1 1 700px;
  max-width: 1000px;
  border-radius: 16px;
  background: #000;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7);
}

/* ===== PEER VIDEOS ===== */
#peers {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(120px,1fr));
  gap: 0.5rem;
  margin-top: 0.5rem;
}
#peers video {
  width: 100%;
  border-radius: 12px;
  background: #000;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}

/* ===== CONTROLS ===== */
#controls {
  position: fixed;
  bottom: 10px;
  left:50%;
  transform: translateX(-50%);
  display:flex;
  gap:0.7rem;
  z-index: 1000;
}
#controls button {
  padding:.5rem 1rem;
  border:none;
  border-radius:999px;
  background: #5865f2;
  color:white;
  font-weight:600;
  cursor:pointer;
  transition: transform 0.2s, background 0.2s;
}
#controls button:hover {
  transform: scale(1.05);
  background: #7289da;
}

/* ===== CHAT ===== */
#chat {
  position: fixed;
  right:0;
  top:64px;
  width:300px;
  height:calc(100% - 64px);
  background: rgba(15,15,30,0.95);
  display:flex;
  flex-direction:column;
  border-left: 1px solid rgba(176,110,255,0.2);
  z-index: 900;
}
#chat-messages {
  flex:1;
  overflow-y:auto;
  padding:0.5rem;
}
#chat input {
  padding:.5rem;
  border-radius:8px;
  border:none;
  margin:.5rem;
  background: #10121c;
  color: #e4e6eb;
}
#chat-message div {
  margin-bottom: 0.3rem;
}
#chat b {
  color: #7289da;
}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
  #chat {
    width: 100%;
    height: 250px;
    bottom:0;
    top:auto;
  }
  #container {
    flex-direction: column;
    align-items: center;
  }
}
</style>
</head>
<body>

<custom-navbar></custom-navbar>

<div id="online">Online: 0</div>

<div id="container">
  <!-- Shared Video -->
  <video id="shared-video" controls></video>

  <!-- Peer Videos -->
  <div id="peers"></div>
</div>

<!-- Controls -->
<div id="controls">
  <button id="mute">Mute</button>
  <button id="cam">Camera</button>
  <button id="play">Play/Pause</button>
</div>

<!-- Global Chat -->
<div id="chat">
  <div id="chat-messages"></div>
  <input id="chat-input" placeholder="Message...">
</div>

<script>
const socket = io();
const username = localStorage.getItem("xemo_username") || prompt("Enter your username") || "Guest";
localStorage.setItem("xemo_username", username);

const peersContainer = document.getElementById("peers");
const sharedVideo = document.getElementById("shared-video");
const chatInput = document.getElementById("chat-input");
const chatMessages = document.getElementById("chat-messages");
const onlineEl = document.getElementById("online");

let localStream;
const peers = {};

// Get webcam & mic
navigator.mediaDevices.getUserMedia({ video:true, audio:true }).then(stream => {
  localStream = stream;
  joinRoom();
});

function joinRoom(){
  socket.emit("join-room",{roomId:"global-call", username});

  socket.on("online-users", users => {
    onlineEl.textContent = "Online: " + users.length;
  });

  socket.on("user-joined", ({id, username})=>{
    createPeer(id, username, true);
  });

  socket.on("user-left", id => {
    if(peers[id]){
      peers[id].video.remove();
      peers[id].pc.close();
      delete peers[id];
    }
  });

  socket.on("signal", async ({from, signal}) => {
    if(!peers[from]) createPeer(from, "Friend", false);
    if(signal.type==='offer'){
      await peers[from].pc.setRemoteDescription(new RTCSessionDescription(signal));
      const answer = await peers[from].pc.createAnswer();
      await peers[from].pc.setLocalDescription(answer);
      socket.emit("signal", { target: from, signal: peers[from].pc.localDescription });
    } else if(signal.type==='answer'){
      await peers[from].pc.setRemoteDescription(new RTCSessionDescription(signal));
    } else if(signal.candidate){
      await peers[from].pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
    }
  });

  socket.on("video-sync", data => {
    sharedVideo.currentTime = data.time;
    data.action==='play' ? sharedVideo.play() : sharedVideo.pause();
  });
}

// Create peer connection
function createPeer(id,name,initiator){
  const pc = new RTCPeerConnection();
  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  const video = document.createElement("video");
  video.autoplay = true;
  video.playsInline = true;
  peersContainer.appendChild(video);

  pc.ontrack = e => { video.srcObject = e.streams[0]; }

  pc.onicecandidate = e => {
    if(e.candidate) socket.emit("signal",{ target:id, signal:{ candidate:e.candidate } });
  }

  peers[id] = { pc, video, name };

  if(initiator){
    pc.createOffer().then(offer => {
      pc.setLocalDescription(offer);
      socket.emit("signal",{ target:id, signal: offer });
    });
  }
}

// --- Controls ---
document.getElementById("mute").onclick = () => {
  const track = localStream.getAudioTracks()[0];
  track.enabled = !track.enabled;
  document.getElementById("mute").textContent = track.enabled ? "Mute" : "Unmute";
};
document.getElementById("cam").onclick = () => {
  const track = localStream.getVideoTracks()[0];
  track.enabled = !track.enabled;
  document.getElementById("cam").textContent = track.enabled ? "Camera" : "Show Cam";
};
document.getElementById("play").onclick = () => {
  if(sharedVideo.paused){
    sharedVideo.play();
    socket.emit("video-sync",{ roomId:"global-call", action:"play", time:sharedVideo.currentTime });
  } else {
    sharedVideo.pause();
    socket.emit("video-sync",{ roomId:"global-call", action:"pause", time:sharedVideo.currentTime });
  }
};

// --- Global chat ---
chatInput.addEventListener("keydown", e => {
  if(e.key==='Enter' && chatInput.value.trim()){
    socket.emit("chat-message",{username,text:chatInput.value});
    chatInput.value='';
  }
});

socket.on("chat-message", msg => {
  const div = document.createElement("div");
  div.innerHTML = `<b>@${msg.username}</b>: ${msg.text}`;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
});
</script>

</body>
  </html>
