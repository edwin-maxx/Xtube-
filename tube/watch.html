<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Watch • XemoTube</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="/components/navbar.js" defer></script>
<script src="/components/floating-chat.js" defer></script>

<style>
body {
  margin: 0;
  padding-top: 64px;
  background: radial-gradient(circle at top, #15182b, #0b0d16);
  color: #e4e6eb;
  font-family: Inter, sans-serif;
}

.wrap {
  max-width: 1100px;
  margin: auto;
  padding: 1.8rem;
}

video {
  width: 100%;
  border-radius: 18px;
  box-shadow: 0 25px 70px rgba(0,0,0,.6);
}

h2 {
  margin: 1rem 0 .6rem;
}

.actions {
  display: flex;
  gap: 1rem;
  margin: 1rem 0;
}

button {
  background: linear-gradient(135deg,#5865f2,#7289da);
  border: none;
  padding: .6rem 1.3rem;
  border-radius: 999px;
  color: white;
  cursor: pointer;
  font-weight: 600;
}

.comments {
  margin-top: 2rem;
}

.comment {
  background: rgba(26,29,46,0.9);
  padding: .9rem;
  border-radius: 14px;
  margin-bottom: .7rem;
}

input, textarea {
  width: 100%;
  background: #10121c;
  color: white;
  border: 1px solid #2b2f4a;
  padding: .7rem;
  border-radius: 12px;
  margin-bottom: .6rem;
}
</style>
</head>

<body>
<custom-navbar></custom-navbar>

<div class="wrap">
  <h2 id="title"></h2>
  <video id="video" controls></video>

  <div class="actions">
    <button onclick="like()">❤️ Like <span id="likes">0</span></button>
  </div>

  <div class="comments">
    <h3>💬 Comments</h3>
    <textarea id="text" placeholder="Write something..."></textarea>
    <button onclick="postComment()">Post</button>
    <div id="list"></div>
  </div>
</div>

<floating-chat></floating-chat>

<script>
const id = new URLSearchParams(location.search).get("id");
const username = localStorage.getItem("xemo_username") || "Guest";

async function loadVideo() {
  const v = await fetch(`/api/videos/${id}`).then(r=>r.json());
  title.textContent = v.title;
  video.src = v.videoUrl;
  likes.textContent = v.likes;
  fetch(`/api/videos/${id}/view`, {method:"POST"});
}

async function loadComments() {
  const c = await fetch(`/api/comments/${id}`).then(r=>r.json());
  list.innerHTML = c.map(x => `
    <div class="comment">
      <b>${x.username}</b><br>${x.text}
    </div>
  `).join("");
}

async function postComment() {
  if (!text.value) return;
  await fetch(`/api/comments/${id}`, {
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ username, text:text.value })
  });
  text.value="";
  loadComments();
}

async function like() {
  const r = await fetch(`/api/videos/${id}/like`,{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ username })
  }).then(r=>r.json());
  likes.textContent = r.likes;
}

loadVideo();
loadComments();
</script>
</body>
</html>
