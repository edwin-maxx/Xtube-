<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Watch | XTube</title>
  <link rel="stylesheet" href="/tube/css/style.css">
  <script type="module" src="/tube/components/navbar.js"></script>
</head>
<body>
  
  <custom-navbar></custom-navbar>

  
  <div class="container">
    <div class="main">
      <video id="player" controls width="100%" style="border-radius:8px;"></video>
      <h2 id="title"></h2>
      <p id="creator"></p>
      <p id="views"></p>

      <div style="display:flex; gap:10px; margin-bottom:15px;">
        <button id="likeBtn">Like (<span id="likeCount">0</span>)</button>
        <a id="downloadBtn" href="#" download>Download</a>
      </div>

      
      <h3>Comments</h3>
      <div id="comments"></div>
      <form id="commentForm" style="margin-top:8px;">
        <input type="text" id="commentInput" placeholder="Write a comment" required style="width:80%;">
        <button>Comment</button>
      </form>
    </div>

    <div class="sidebar">
      
      <h3>Recommended Videos</h3>
      <div id="recommended"></div>

    
      <h3>Global Chat</h3>
      <div id="chat" style="height:200px; overflow-y:auto; border-radius:6px; padding:5px;"></div>
      <div style="display:flex; gap:5px; margin-top:5px;">
        <input type="text" id="chatInput" placeholder="Type a message" style="flex:1;">
        <button id="sendChat">Send</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/user.js"></script>
  <script>
    const videoId = new URLSearchParams(location.search).get("id");
    const player = document.getElementById("player");
    const titleEl = document.getElementById("title");
    const creatorEl = document.getElementById("creator");
    const viewsEl = document.getElementById("views");
    const likeBtn = document.getElementById("likeBtn");
    const likeCount = document.getElementById("likeCount");
    const downloadBtn = document.getElementById("downloadBtn");
    const recommendedDiv = document.getElementById("recommended");
    const commentsDiv = document.getElementById("comments");
    const commentForm = document.getElementById("commentForm");
    const chatDiv = document.getElementById("chat");
    const chatInput = document.getElementById("chatInput");
    const sendChat = document.getElementById("sendChat");
    const username = getUsername();

    
    async function loadVideo() {
      const res = await fetch("/api/videos/" + videoId);
      const video = await res.json();

      player.src = video.videoUrl;
      titleEl.innerText = video.title;
      creatorEl.innerText = "By " + video.creator;
      viewsEl.innerText = video.views + " views";
      likeCount.innerText = video.likes;
      downloadBtn.href = video.videoUrl;

      loadRecommended(videoId);
      loadComments();
    }

    
    fetch("/api/videos/" + videoId + "/view", { method: "POST" });

    
    likeBtn.addEventListener("click", async () => {
      const res = await fetch("/api/videos/" + videoId + "/like", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username })
      });
      const data = await res.json();
      likeCount.innerText = data.likes;
    });

    
    async function loadRecommended(currentId) {
      const res = await fetch("/api/videos");
      const videos = await res.json();
      const recs = videos.filter(v => v._id !== currentId).slice(0, 5);
      recommendedDiv.innerHTML = "";
      recs.forEach(v => {
        const div = document.createElement("div");
        div.style.cursor = "pointer";
        div.innerHTML = `<img src="${v.thumbnail}" width="120" style="border-radius:4px;"><p>${v.title}</p>`;
        div.onclick = () => location.href = "/watch?id=" + v._id;
        recommendedDiv.appendChild(div);
      });
    }

  
    async function loadComments() {
      const res = await fetch("/api/comments/" + videoId);
      const comments = await res.json();
      commentsDiv.innerHTML = "";

      comments.forEach(c => {
        const div = document.createElement("div");
        div.innerHTML = `<b>${c.username}</b>: ${c.text} 
          <button onclick="reply('${c._id}')">Reply</button>
          <div style="margin-left:15px;" id="replies-${c._id}">
            ${c.replies.map(r => `<b>${r.username}</b>: ${r.text}`).join("<br>")}
          </div>`;
        commentsDiv.appendChild(div);
      });
    }

  
    commentForm.addEventListener("submit", async e => {
      e.preventDefault();
      const text = document.getElementById("commentInput").value;
      if (!text) return;
      await fetch("/api/comments/" + videoId, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, text })
      });
      document.getElementById("commentInput").value = "";
      loadComments();
    });

    
    window.reply = async (commentId) => {
      const text = prompt("Reply:");
      if (!text) return;
      await fetch("/api/comments/reply/" + commentId, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, text })
      });
      loadComments();
    };

    
    const socket = io();
    sendChat.addEventListener("click", () => {
      if (!chatInput.value) return;
      socket.emit("chat-message", { username, text: chatInput.value });
      chatInput.value = "";
    });

    socket.on("chat-message", msg => {
      const div = document.createElement("div");
      div.innerHTML = `<b>${msg.username}</b>: ${msg.text}`;
      chatDiv.appendChild(div);
      chatDiv.scrollTop = chatDiv.scrollHeight;
    });

    loadVideo();
  </script>
</body>
</html>
