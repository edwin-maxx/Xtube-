<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Video | XTube</title>
  <link rel="stylesheet" href="/tube/css/style.css">
  <script type="module" src="/tube/components/navbar.js"></script>
</head>
<body>

  <custom-navbar></custom-navbar>

  
  <div class="container" style="flex-direction:column; gap:20px; padding:40px; max-width:700px; margin:auto;">
    <h2 style="color:#fff;">Upload Your Video</h2>

    <form id="uploadForm" style="display:flex; flex-direction:column; gap:15px; background:#1e1f29; padding:20px; border-radius:10px;">
      <input type="text" id="title" placeholder="Video Title" required>
      <input type="text" id="creator" placeholder="Creator Name" required>
      <textarea id="description" rows="4" placeholder="Video Description"></textarea>
      <input type="file" id="videoFile" accept="video/*" required>
      <button type="submit" style="background:linear-gradient(90deg,#6b46c1,#d53f8c,#60cdf6); color:#fff;">Upload Video</button>
    </form>

    <div id="status" style="color:#fff; margin-top:10px;"></div>
  </div>

  <script>
    const username = getUsername(); // Ensure username exists in localStorage
    const uploadForm = document.getElementById("uploadForm");
    const statusDiv = document.getElementById("status");

    uploadForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const title = document.getElementById("title").value;
      const creator = document.getElementById("creator").value || username;
      const description = document.getElementById("description").value;
      const file = document.getElementById("videoFile").files[0];

      if(!file){
        statusDiv.innerText = "Please select a video file!";
        return;
      }

      statusDiv.innerText = "Uploading video to Catbox... ⏳";

      const formData = new FormData();
      formData.append("videoFile", file);
      formData.append("title", title);
      formData.append("creator", creator);
      formData.append("description", description);

      try {
        const res = await fetch("/api/upload", {
          method: "POST",
          body: formData
        });
        const data = await res.json();

        if(data.success){
          statusDiv.innerHTML = `✅ Video uploaded successfully! <a href="/watch?id=${data.video._id}">Watch now</a>`;
          uploadForm.reset();
        } else {
          statusDiv.innerText = "❌ Upload failed: " + data.message;
        }
      } catch(err){
        statusDiv.innerText = "❌ Upload failed: " + err.message;
      }
    });
  </script>
</body>
</html>
