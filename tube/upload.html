<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Upload • XTube</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="/components/navbar.js" defer></script>
<script src="/components/floating-chat.js" defer></script>

<style>
body {
  margin: 0;
  padding-top: 64px;
  background: radial-gradient(circle at top, #15182b, #0b0d16);
  color: #e4e6eb;
  font-family: Inter, sans-serif;
}

.card {
  max-width: 520px;
  margin: 3rem auto;
  background: rgba(26,29,46,0.9);
  padding: 2.2rem;
  border-radius: 20px;
  box-shadow: 0 30px 80px rgba(0,0,0,.6);
}

h2 {
  text-align: center;
  margin-bottom: 1.5rem;
}

input, button {
  width: 100%;
  padding: .8rem;
  margin-bottom: 1rem;
  border-radius: 14px;
  border: none;
}

input {
  background: #10121c;
  color: white;
}

button {
  background: linear-gradient(135deg,#5865f2,#7289da);
  color: white;
  font-weight: 700;
  cursor: pointer;
}
</style>
</head>

<body>
<custom-navbar></custom-navbar>

<div class="card">
  <h2>🚀 Upload Video</h2>
  <input id="title" placeholder="Title">
  <input id="creator" placeholder="Creator">
  <input id="thumb" placeholder="Thumbnail URL">
  <input type="file" id="video">
  <button onclick="upload()">Upload</button>
</div>

<floating-chat></floating-chat>

<script>
async function upload() {
  const fd = new FormData();
  fd.append("title", title.value);
  fd.append("creator", creator.value);
  fd.append("thumbnail", thumb.value);
  fd.append("video", video.files[0]);

  await fetch("/api/upload", { method:"POST", body: fd });
  alert("Upload successful!");
  location.href = "/";
}
</script>
</body>
</html>
