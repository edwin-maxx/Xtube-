<!DOCTYPE html>
<html>
<head>
  <title>Upload | XemoTube</title>
</head>
<body>

<h2>Upload Video</h2>

<form id="uploadForm">
  <input type="text" id="title" placeholder="Video title" required><br><br>
  <input type="text" id="thumbnail" placeholder="Thumbnail URL" required><br><br>
  <input type="file" id="video" accept="video/*" required><br><br>
  <button type="submit">Upload</button>
</form>

<script src="/js/user.js"></script>
<script>
  const form = document.getElementById("uploadForm");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const creator = getUsername();
    const data = new FormData();

    data.append("title", title.value);
    data.append("creator", creator);
    data.append("thumbnail", thumbnail.value);
    data.append("video", video.files[0]);

    const res = await fetch("/api/upload", {
      method: "POST",
      body: data
    });

    const json = await res.json();
    alert("Uploaded!");
    location.href = "/watch?id=" + json._id;
  });
</script>

</body>
</html>
