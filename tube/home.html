<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>XTube</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- PWA manifest and theme color -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f0f1e">

<!-- Components -->
<script src="/components/navbar.js" defer></script>
<script src="/components/floating-chat.js" defer></script>

<style>
body {
  padding-top: 64px; /* space for fixed navbar */
  margin: 0;
  background: radial-gradient(circle at top, #15182b, #0b0d16);
  color: #e4e6eb;
  font-family: Inter, system-ui, sans-serif;
}

.container {
  max-width: 1400px;
  margin: auto;
  padding: 2rem;
}

h2 {
  margin-bottom: 1.5rem;
  font-size: 1.8rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1.8rem;
}

.card {
  background: rgba(26,29,46,0.85);
  border-radius: 18px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .25s, box-shadow .25s;
  box-shadow: 0 20px 40px rgba(0,0,0,.45);
}

.card:hover {
  transform: translateY(-8px) scale(1.02);
  box-shadow: 0 30px 70px rgba(0,0,0,.6);
}

.thumb {
  width: 100%;
  height: 170px;
  object-fit: cover;
}

.info {
  padding: 1rem;
}

.title {
  font-weight: 800;
  font-size: 1rem;
  margin-bottom: .4rem;
}

.meta {
  font-size: .85rem;
  color: #9aa4bf;
}
</style>
</head>

<body>
<custom-navbar></custom-navbar>

<div class="container">
  <h2>🎬 Discover</h2>
  <div class="grid" id="videos"></div>
</div>

<floating-chat></floating-chat>

<script>
const videosEl = document.getElementById("videos");

fetch("/api/videos")
  .then(res => res.json())
  .then(videos => {
    videosEl.innerHTML = videos.map(v => `
      <div class="card" onclick="location.href='/watch?id=${v._id}'">
        <img class="thumb" src="${v.thumbnail}">
        <div class="info">
          <div class="title">${v.title}</div>
          <div class="meta">${v.creator} • ${v.views} views</div>
        </div>
      </div>
    `).join("");
  });
</script>

<!-- Register Service Worker for PWA -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(() => console.log('Service Worker registered ✅'))
      .catch(err => console.error('Service Worker failed ❌', err));
  });
}
</script>
</body>
</html>
