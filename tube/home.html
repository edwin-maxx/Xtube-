<!DOCTYPE html>
<html>
<head>
  <title>XemoTube</title>
  <style>
    .video {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      cursor: pointer;
    }
    img {
      width: 160px;
    }
  </style>
</head>
<body>

<h1>XemoTube</h1>

<div id="videos"></div>

<script>
  fetch("/api/videos")
    .then(res => res.json())
    .then(videos => {
      const container = document.getElementById("videos");

      videos.forEach(v => {
        const div = document.createElement("div");
        div.className = "video";

        div.innerHTML = `
          <img src="${v.thumbnail}">
          <div>
            <h3>${v.title}</h3>
            <p>${v.creator}</p>
            <small>${v.views} views</small>
          </div>
        `;

        div.onclick = () => {
          location.href = "/watch?id=" + v._id;
        };

        container.appendChild(div);
      });
    });
</script>

</body>
</html>
