<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home | XemoTube</title>
  <link rel="stylesheet" href="/tube/css/style.css">
  <script type="module" src="/tube/components/navbar.js"></script>
</head>
<body>

  <custom-navbar></custom-navbar>


  <div class="container" style="flex-direction:row; flex-wrap:wrap; gap:20px; padding:20px;">
    <div id="videos" style="display:flex; flex-wrap:wrap; gap:20px; justify-content:center;"></div>
  </div>

  <script>
    const videosDiv = document.getElementById("videos");
    async function loadVideos() {
      const res = await fetch("/api/videos");
      const videos = await res.json();
      videosDiv.innerHTML = "";
      videos.forEach(v => {
        const card = document.createElement("div");
        card.style.background = "#2f3136";
        card.style.borderRadius = "8px";
        card.style.width = "220px";
        card.style.cursor = "pointer";
        card.style.overflow = "hidden";
        card.innerHTML = `
          <img src="${v.thumbnail}" width="100%" style="display:block;">
          <div style="padding:8px;">
            <h4 style="margin:2px 0; color:#fff;">${v.title}</h4>
            <p style="margin:2px 0; font-size:0.85em; color:#aaa;">${v.creator}</p>
            <p style="margin:2px 0; font-size:0.8em; color:#888;">${v.views} views</p>
          </div>
        `;
        card.onclick = () => location.href = "/watch?id=" + v._id;
        videosDiv.appendChild(card);
      });
    }

    loadVideos();
  </script>
</body>
</html>
