<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>XTube • Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/components/navbar.js" defer></script>

<style>
body {
  margin: 0;
  background: #0f111a;
  color: #e4e6eb;
  font-family: Inter, system-ui, sans-serif;
}
.container {
  padding: 2rem;
  max-width: 1300px;
  margin: auto;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1.5rem;
}
.card {
  background: #1a1d2e;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,.4);
  transition: transform .2s;
}
.card:hover { transform: translateY(-6px); }
.thumb {
  width: 100%;
  height: 160px;
  object-fit: cover;
}
.card-body {
  padding: 1rem;
}
.title {
  font-weight: 700;
  margin-bottom: .4rem;
}
.meta {
  font-size: .85rem;
  color: #9aa4bf;
}
</style>
</head>

<body>
<custom-navbar></custom-navbar>

<div class="container">
  <h2>🔥 Latest Videos</h2>
  <div class="grid" id="videos"></div>
</div>

<script>
async function loadVideos() {
  const res = await fetch("/api/videos");
  const videos = await res.json();

  document.getElementById("videos").innerHTML = videos.map(v => `
    <div class="card" onclick="location.href='/watch?id=${v._id}'">
      <img class="thumb" src="${v.thumbnail}" />
      <div class="card-body">
        <div class="title">${v.title}</div>
        <div class="meta">${v.creator} • ${v.views} views</div>
      </div>
    </div>
  `).join("");
}
loadVideos();
</script>
</body>
</html>
